name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # oxlint-plugin-anti-slop builds itself with pnpm when npm installs it from git.
      - run: npm install --global pnpm@10.33.0
      - run: npm ci
      - run: npm run build

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # oxlint-plugin-anti-slop builds itself with pnpm when npm installs it from git.
      - run: npm install --global pnpm@10.33.0
      - run: npm ci
      - run: npm run format:check

  oxlint:
    name: Oxlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # oxlint-plugin-anti-slop builds itself with pnpm when npm installs it from git.
      - run: npm install --global pnpm@10.33.0
      - run: npm ci
      - run: npm run lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # oxlint-plugin-anti-slop builds itself with pnpm when npm installs it from git.
      - run: npm install --global pnpm@10.33.0
      - run: npm ci
      - run: npm run test:coverage -- --reporter=default --reporter=json --outputFile=vitest-report.json
      - run: node scripts/assert-no-skips.mjs vitest vitest-report.json

  e2e:
    name: E2E tests (shard ${{ matrix.shard }}/2)
    # macOS, not Linux: the game needs a GPU (Metal); Linux runners render WebGL in software at under 1 fps.
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # oxlint-plugin-anti-slop builds itself with pnpm when npm installs it from git.
      - run: npm install --global pnpm@10.33.0
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2 --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
      - run: node scripts/assert-no-skips.mjs playwright playwright-report.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report.json
          retention-days: 7
